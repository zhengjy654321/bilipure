plugins { id 'com.android.application' }
android {
    namespace 'com.jiyu.bilipure'
    compileSdk 35
    defaultConfig {
        applicationId 'com.jiyu.bilipure'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
dependencies { implementation 'androidx.core:core:1.15.0'; implementation 'androidx.webkit:webkit:1.12.1' }
