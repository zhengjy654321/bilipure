name: Build Android APK
on:
  push:
    branches: [temporary/side-by-side-060]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check JavaScript syntax
        run: |
          node --check app/src/main/assets/classroom.js
          node --check app/src/main/assets/bridge.js
          node --check app/src/main/assets/touch-player.js
          node --check app/src/main/assets/goal-core.js
          node tests/goal-core.test.cjs
          node --check app/src/main/assets/rewards-core.js
          node tests/rewards-core.test.cjs
      - name: Check tablet login gestures in Chrome
        run: |
          python -m venv "$RUNNER_TEMP/login-test"
          "$RUNNER_TEMP/login-test/bin/pip" install playwright==1.55.0
          "$RUNNER_TEMP/login-test/bin/python" tests/homepage-login.py
      - name: Build and lint
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/lemon-classroom-temporary-0.6.3.apk
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$aapt" dump badging dist/*.apk > /tmp/badging.txt
          grep -F "package: name='com.jiyu.bilipure.trial'" /tmp/badging.txt
          grep -F "application-label:'柠檬课堂·临时版'" /tmp/badging.txt
          grep -F "launchable-activity: name='com.jiyu.bilipure.MainActivity'" /tmp/badging.txt
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bilipure-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 1
